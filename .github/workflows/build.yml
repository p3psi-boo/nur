name: Build packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: CACHIX
    timeout-minutes: 360
    env:
      CACHIX_CACHE: ${{ secrets.NUR_CACHIX_NAME }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1

      - name: Use NUR binary cache
        if: env.CACHIX_CACHE != ''
        run: |
          nix shell --no-update-lock-file --inputs-from . nixpkgs#cachix \
            --command cachix use "$CACHIX_CACHE" --mode user-nixconf

      - name: Evaluate and build packages
        id: build
        run: python3 tools/ci/build.py build

      - name: Commit verified synchronization hash repairs
        if: >-
          steps.build.outputs.repaired == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'automation/nixpkgs-sync' &&
          github.event.pull_request.user.login == github.repository_owner &&
          github.event.pull_request.base.ref == 'main'
        env:
          NUR_SYNC_TOKEN: ${{ secrets.NUR_SYNC_TOKEN }}
        run: python3 tools/ci/build.py publish

      - name: Publish redistributable outputs
        if: github.ref == 'refs/heads/main' && env.CACHIX_CACHE != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_AUTH_TOKEN"
          nix eval --no-update-lock-file --json .#checks.x86_64-linux \
            --apply 'checks: builtins.filter (name:
              let
                meta = (builtins.getAttr name checks).meta or {};
                license = meta.license or [];
                licenses = if builtins.isList license then license else [ license ];
              in
              licenses != []
              && builtins.all (item: item.redistributable or false) licenses
              && builtins.elem "x86_64-linux" (meta.hydraPlatforms or [ "x86_64-linux" ])
            ) (builtins.attrNames checks)' > "$RUNNER_TEMP/nur-redistributable.json"
          jq --raw-output --slurpfile allowed "$RUNNER_TEMP/nur-redistributable.json" '
            .results[]
            | select(.success and (.type == "BUILD" or (.type == "EVAL" and .cacheStatus == "local")))
            | select(.attr as $attr | $allowed[0] | index($attr))
            | .outputs[]? | strings
          ' "$RUNNER_TEMP/nur-build.json" | sort -u > "$RUNNER_TEMP/nur-outputs"
          if [ -s "$RUNNER_TEMP/nur-outputs" ]; then
            nix shell --no-update-lock-file --inputs-from . nixpkgs#cachix \
              --command cachix push "$CACHIX_CACHE" < "$RUNNER_TEMP/nur-outputs"
          fi
